name: Build LEED Studio for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install application and pinned build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==2.2.6" "scipy==1.15.3" "pyinstaller==6.19.0"
          pip install .
          pip check

      - name: Build executable
        run: pyinstaller --noconfirm --clean LEED_Studio.spec

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: LEED-Studio-Windows
          path: dist/
