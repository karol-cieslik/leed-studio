[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leed-studio"
version = "0.11.1"
description = "Standalone LEED image analysis and I(V) exploration desktop application"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7,<7",
  "pyqtgraph>=0.13.7",
  "numpy>=1.26",
  "scipy>=1.11",
  "Pillow>=10.0",
  "tifffile>=2024.1"
]

[project.scripts]
leed-studio = "leed_studio.app:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["leed_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
leed_studio = ["data/*.tif", "data/*.ico"]
